[package]
name = "chunkstore-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
chunkstore-core = { path = "..", package = "chunkstore-core" }

[[bin]]
name = "fixed_chunker"
path = "fuzz_targets/fixed_chunker.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cdc_chunker"
path = "fuzz_targets/cdc_chunker.rs"
test = false
doc = false
bench = false
