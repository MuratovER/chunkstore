name: Feature request
description: A change that fits embeddable CAS (not a backup CLI)
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Who embeds chunkstore and what problem this solves.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: API / on-disk format impact. Breaking format changes need a version bump.
    validations:
      required: true
